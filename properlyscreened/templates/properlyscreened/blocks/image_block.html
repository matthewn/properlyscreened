{% load wagtailimages_tags wagtailcore_tags typefixes %}

<figure
    class="{% if value.float == 1 %}float left{% elif value.float == 2 %}float right{% endif %}{% if value.max_width|slice:'-2:' == 'px' %}{% if value.float == 1 or value.float == 2 %} {% endif %}px-width{% endif %}"
    {% if value.max_width %}style="--max-width: {{ value.max_width }};"{% endif %}>
    {% if value.image %}
        {% image value.image width-800 as small_image %}
        {% if value.link %}<a href="{{ value.link }}">{% endif %}
        <img src="{{ small_image.url }}" alt="{{ value.image.description|default:value.image.title }}">
        {% if value.link %}</a>{% endif %}
    {% endif %}
    {% if value.caption %}
        <figcaption class="caption">{{ value.caption|richtext|typefixes }}</figcaption>
    {% endif %}
</figure>
