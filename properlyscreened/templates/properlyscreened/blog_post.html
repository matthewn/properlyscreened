{% extends "base.html" %}
{% load wagtailcore_tags %}
{% load wagtailroutablepage_tags %}
{% load text_tags %}
{% load typefixes %}

{% block title %}{{ page.title }}{% endblock %}

{% block main %}

<div class="wrapper">

    <p class="date-published">{{ page.first_published_at|date:"F j, Y" }}</p>

    <div class="body">
        {{ page.body|typefixes }}
    </div>

</div>

{% endblock %}
